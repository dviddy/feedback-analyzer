<!DOCTYPE html>
<html>
<head>
    <title>Customer Feedback Analyzer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
    }

        .header {
            text-align: center;
            margin-bottom: 35px;
    }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
    }

        .header p {
            font-size: 18px;
            color: #6b7280;
    }

        .input-card,
        #results {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
    }

        textarea {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            resize: vertical;
    }

        button {
            margin-top: 15px;
            padding: 13px 22px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
    }

        button:hover {
            background: #1d4ed8;
    }

        #results h2 {
            margin-top: 0;
    }

        .priority {
            font-weight: bold;
            font-size: 20px;
    }

        .insight {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: #f8fafc;
        }

        .insight strong {
            display: block;
            margin-bottom: 5px;
    }

        .priority-high {
            border-left: 5px solid #dc2626;
    }

        .priority-low {
            border-left: 5px solid #16a34a;
    }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
    }

        .kpi {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e5e7eb;
    }

        .kpi-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
    }

        .kpi-label {
            font-size: 14px;
            color: #6b7280;
    }

    </style>
    
</head>

<body>

   <div class="header">
        <h1>Member Experience Intelligence</h1>
        <p>Turn feedback into actionable CX insights.</p>
</div>  

    <div class="input-card">
        <h2>Analyze Feedback</h2>
        <p>Paste a comment below to identify key CX insights.</p>
        <textarea id="feedback" rows="6" placeholder="Example: I've tried logging in three times and keep getting an error."></textarea>
    <button onclick="analyzeSingleFeedback()">Analyze Feedback</button>
    
</div>

<div class="input-card">
    <h2>Analyze Multiple Comments</h2>
    <p>Upload a CSV file containing feedback.</p>

    <input type="file" id="csvFile" accept=".csv">
    <button onclick="analyzeCSV()">Analyze CSV</button>

</div>

    <div id="results">
        <h2>Analysis Results</h2>

        <div id="summary"></div>

        <div id="analysis"></div>
</div>

    <script src="browser.js"></script>

</body>
</html>
