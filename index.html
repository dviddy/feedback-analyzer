<!DOCTYPE html>
<html>
<head>
    <title>Customer Feedback Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #results {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            white-space: pre-line;
        }

        .priority {
            font-weight: bold;
            font-size: 20px;
            color: red
        }

    </style>
</head>

<body>

    <h1>Customer Feedback Analyzer</h1>

    <p>Enter customer feedback below:</p>

    <textarea id="feedback" rows="6" cols="60"></textarea>

    <br><br>

    <button onclick="analyzeFeedback()">Analyze Feedback</button>

    <div id="results">
        <h2>Analysis Results</h2>
        <div id="analysis"></div>
    </div>

    <script src="browser.js"></script>

</body>
</html>
